# Public hosted Lido — own GHCR images only (never kevinguest/lido or lido-ui).
# Live pool: https://lido.wtf
# Live Umbrel demo: https://try.lido.wtf (separate; not this stack).

services:
  web:
    image: ghcr.io/kevinguest/lido-public-ui:${LIDO_PUBLIC_UI_TAG:-0.1.1}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - DOMAIN=${DOMAIN:-lido.wtf}
      - LIDO_PUBLIC=true
      - NEXT_PUBLIC_LIDO_PUBLIC=true
      - PUBLIC_POOL_API_URL=http://server:2299
      - PUBLIC_POOL_STRATUM_URL=${PUBLIC_POOL_STRATUM_URL:-lido.wtf:3333}
      - NEXT_PUBLIC_POOL_STRATUM_URL=${PUBLIC_POOL_STRATUM_URL:-lido.wtf:3333}
    depends_on:
      - server

  server:
    image: ghcr.io/kevinguest/lido-public:${LIDO_PUBLIC_TAG:-0.1.1}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${STRATUM_V1_HOST_PORT:-3333}:3333/tcp"
      - "${STRATUM_V2_HOST_PORT:-4444}:4444/tcp"
      - "${API_HOST_PORT:-2299}:2299/tcp"
    volumes:
      - ./data/database:/public-pool/DB
    environment:
      - NODE_ENV=production
      - BITCOIN_RPC_URL=${BITCOIN_RPC_URL}
      - BITCOIN_RPC_USER=${BITCOIN_RPC_USER}
      - BITCOIN_RPC_PASSWORD=${BITCOIN_RPC_PASSWORD}
      - BITCOIN_RPC_PORT=${BITCOIN_RPC_PORT:-8332}
      - BITCOIN_RPC_TIMEOUT=${BITCOIN_RPC_TIMEOUT:-10000}
      - BITCOIN_ZMQ_HOST=${BITCOIN_ZMQ_HOST:-}
      - API_PORT=2299
      - STRATUM_PORT=3333
      - ENABLE_STRATUM_V2=true
      - STRATUM_V2_PORT=4444
      - NETWORK=${NETWORK:-mainnet}
      - API_SECURE=false
      - ENABLE_SOLO=true
      - ENABLE_PROXY=false
      - POOL_IDENTIFIER=${POOL_IDENTIFIER:-Lido}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

  proxy:
    image: nginx:1.25.3
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - server
